services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: plantifiles
      POSTGRES_USER: plantifiles
      POSTGRES_PASSWORD: plantifiles
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plantifiles -d plantifiles"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - plantifiles-postgres:/var/lib/postgresql/data

volumes:
  plantifiles-postgres:
